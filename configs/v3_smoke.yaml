# Local smoke-test config — tiny model, tiny seq, 1 epoch on 5 samples.
# Only purpose: verify the SFTTrainer/SFTConfig/data-pipeline path through
# train_teacher.py works end-to-end before booking an EC2 GPU. Hyperparams
# are NOT tuned — completion of one optimiser step = pass.

teacher:
  hf_id: "unsloth/gemma-3-270m-it"
  load_in_4bit: false
  use_unsloth_bnb_4bit: false

  lora:
    r: 4
    alpha: 8
    dropout: 0.0
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj

  sft:
    epochs: 1
    per_device_batch_size: 1
    gradient_accumulation_steps: 1
    learning_rate: 5.0e-5
    warmup_ratio: 0.0
    weight_decay: 0.0
    max_seq_length: 512
    optim: "adamw_8bit"
    save_steps: 1000
    eval_steps: 1000
    seed: 42

students: []
